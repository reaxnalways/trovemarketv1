name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://rklqihkhlemxovvedkag.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y7RY2Zaw6OrkjWShN0TYCw_YOAqSYIy
      TROVE_ADMIN_EMAILS: ${{ secrets.TROVE_ADMIN_EMAILS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1cb4359ac870fb5ff1ecaac8f8b51279
      VINEXT_KV_NAMESPACE_ID: cce65f3d53d544c5b066fe75ff8723a0
      CLOUDFLARE_WORKER_NAME: trovemarketv1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment environment
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub Actions secret is missing."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Initialize Vinext Cloudflare build
        shell: bash
        run: |
          npx --yes vinext@1.0.0-beta.6 init \
            --skip-check \
            --platform=cloudflare \
            --data-cache=kv \
            --image-optimization=cloudflare-images

      - name: Configure Cloudflare bindings and runtime variables
        shell: bash
        run: |
          node <<'NODE'
          import fs from "node:fs";

          const path = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));

          config.name = process.env.CLOUDFLARE_WORKER_NAME;
          config.kv_namespaces = (config.kv_namespaces ?? []).map((item) =>
            item.binding === "VINEXT_KV_CACHE"
              ? { ...item, id: process.env.VINEXT_KV_NAMESPACE_ID }
              : item
          );
          config.vars = {
            ...(config.vars ?? {}),
            NEXT_PUBLIC_SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL,
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
            TROVE_ADMIN_EMAILS: process.env.TROVE_ADMIN_EMAILS ?? "",
          };

          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Build Vinext Worker
        run: npx vinext build

      - name: Deploy Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          config="$(find dist -name wrangler.json -type f | head -n 1)"
          if [ -z "$config" ]; then
            echo "::error::Vinext generated wrangler.json was not found."
            exit 1
          fi
          echo "Using generated config: $config"
          npx wrangler deploy --config "$config"

      - name: Verify live health endpoint
        shell: bash
        run: |
          url="https://${CLOUDFLARE_WORKER_NAME}.remziemiraltunbas.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$url/api/health"; then
              echo "Production healthy: $url"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production health check failed at $url/api/health"
          exit 1
